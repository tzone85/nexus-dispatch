name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

# Least privilege: every job reads the repo; only `release` needs to write
# (create the GitHub release and upload assets) and declares that itself.
permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.26.5'

      - name: Install dependencies
        run: go mod download

      - name: Vet
        run: go vet ./...

      - name: Run tests
        run: go test -race -coverprofile=coverage.out -covermode=atomic ./...

      - name: Check coverage threshold
        run: |
          COVERAGE=$(go tool cover -func=coverage.out | grep '^total:' | awk '{print $NF}' | tr -d '%')
          echo "Total coverage: ${COVERAGE}%"
          THRESHOLD=50
          if [ "$(echo "$COVERAGE < $THRESHOLD" | bc -l)" -eq 1 ]; then
            echo "::error::Coverage ${COVERAGE}% is below threshold ${THRESHOLD}%"
            exit 1
          fi

      - name: Per-package coverage floors
        # Hot packages sit above their floor today. Floors catch silent
        # regressions when new feature code lands without matching tests.
        # Architectural ceilings (live infra needed) are documented in
        # CLAUDE.md and excluded from this gate. Floors are set ~3-5pp below
        # current coverage to leave room for honest noise.
        #
        # Per-package numbers are derived from the SAME coverage.out the
        # "Run tests" step produced (go tool cover -func, aggregated per
        # package directory) so the suite runs once, not twice.
        env:
          # Space-separated <pkg>:<floor> pairs. Edit in lockstep with
          # CLAUDE.md "Build & test" when ratcheting floors up.
          FLOORS: >-
            internal/agent:85
            internal/artifact:85
            internal/cli:69
            internal/config:85
            internal/criteria:65
            internal/devdb:70
            internal/devdb/docker:40
            internal/devdb/null:95
            internal/engine:79
            internal/git:80
            internal/graph:90
            internal/improver:85
            internal/llm:85
            internal/memory:90
            internal/metrics:85
            internal/nlog:90
            internal/plugin:85
            internal/routing:80
            internal/runtime:80
            internal/sanitize:95
            internal/scratchboard:80
            internal/state:80
            internal/update:85
            internal/web:78
        run: |
          set -e
          MODULE=github.com/tzone85/nexus-dispatch
          # coverage.out (covermode=atomic) lines look like:
          #   <file>:<start>.<col>,<end>.<col> <numStatements> <count>
          # Aggregate statements covered / total per package directory.
          awk -v module="$MODULE/" 'NR > 1 {
            split($1, parts, ":"); file = parts[1];
            n = split(file, segs, "/"); pkg = "";
            for (i = 1; i < n; i++) pkg = pkg (i > 1 ? "/" : "") segs[i];
            sub("^" module, "", pkg);
            total[pkg] += $2; if ($3 > 0) covered[pkg] += $2;
          } END {
            for (p in total) printf "%s %.1f\n", p, (covered[p] / total[p]) * 100;
          }' coverage.out | sort > /tmp/pkgcover.txt
          echo "Per-package coverage:"; cat /tmp/pkgcover.txt

          FAIL=0
          for pair in $FLOORS; do
            pkg="${pair%:*}"
            floor="${pair##*:}"
            pct=$(awk -v p="$pkg" '$1 == p { print $2 }' /tmp/pkgcover.txt)
            if [ -z "$pct" ]; then
              echo "::warning file=${pkg}::no coverage data found"
              continue
            fi
            below=$(echo "$pct < $floor" | bc -l)
            if [ "$below" = "1" ]; then
              echo "::error file=${pkg}::coverage ${pct}% < floor ${floor}%"
              FAIL=1
            else
              echo "OK ${pkg}: ${pct}% (floor ${floor}%)"
            fi
          done
          exit $FAIL

      - name: Upload coverage
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage
          path: coverage.out

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.26.5'

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@4afd733a84b1f43292c63897423277bb7f4313a9 # v8.0.0
        with:
          version: v2.12.2

  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.26.5'

      - name: Build binary
        run: go build -o nxd ./cmd/nxd

      - name: Upload binary
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: nxd-${{ matrix.os }}
          path: nxd

  leak-check:
    name: Leak check
    runs-on: ubuntu-latest
    # Hard gate: blocks merge if private terms (client names, personal
    # paths, employer domains) slip into a public commit. Update
    # scripts/check-leaks.sh when adding new forbidden tokens.
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Run leak check
        # The private term list is a repository secret (newline-separated
        # `<regex>|<description>` entries). Forks without it get a visible
        # "skipped" warning, never a silent pass. See CONTRIBUTING.md.
        env:
          LEAK_TERMS: ${{ secrets.LEAK_TERMS }}
        run: bash scripts/check-leaks.sh

  schema-drift:
    name: Schema drift
    runs-on: ubuntu-latest
    # migrations/001_init.sql is generated from internal/state/sqlite.go;
    # fail when someone changes one without the other.
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Check migrations match sqlite.go
        run: bash scripts/check-schema-drift.sh

  e2e:
    name: E2E (replay + dry-run)
    runs-on: ubuntu-latest
    # Build-tagged end-to-end lane: real FileStore + SQLite projection, real
    # git fixture repos, llm.ReplayClient / DryRunClient instead of Ollama.
    # Live scenarios (build tag `live`) are not compiled here; anything that
    # calls RequireOllama skips cleanly when :11434 is not listening.
    #
    # NON-BLOCKING FOR NOW: the replay scenarios assert exact story counts
    # (e.g. "expected 3 stories, got 5") that predate the planner's
    # emit_integration_story / emit_scribe_story defaults. Until the fixtures
    # set both flags false in test/helpers_test.go NewTestConfig (or update
    # their expectations) this lane reports but does not gate merges. Flip
    # continue-on-error to false once `go test -tags e2e ./test/...` is green.
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.26.5'

      - name: Compile e2e tag (blocking)
        run: go vet -tags e2e ./test/...

      - name: Run e2e scenarios
        run: go test -tags e2e -count=1 -timeout 300s ./test/...

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    # S3-2: verify the Dockerfile still builds. Non-blocking on PR.
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Build container image
        run: docker build -t nxd:ci .

  tmux-integration:
    name: tmux integration
    runs-on: ubuntu-latest
    # Runs the live-tmux test lane (build-tagged so the default
    # `go test ./...` lane doesn't try to spin up a tmux server in
    # CI containers that don't ship it). Covers the realRun /
    # realOutput paths that the mocked unit tests can't reach.
    # Non-blocking on PR so a transient tmux issue doesn't gate
    # merges, but failures are visible to operators.
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.26.5'

      - name: Install tmux
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends tmux
          tmux -V

      - name: Run live-tmux tests
        run: go test -tags live_tmux -v -timeout 60s ./internal/tmux/...

  mempalace:
    name: MemPalace bridge
    runs-on: ubuntu-latest
    # Verifies our pinned MemPalace install + the Python bridge contract
    # hasn't drifted (search --results vs --max-results, wake-up vs
    # wakeup, etc.). Catches integration breakage that the unit tests
    # alone can't because they stub the bridge.
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'

      - name: Install MemPalace
        run: pip install -r requirements.txt

      - name: Bridge health
        run: |
          python3 scripts/mempalace_bridge.py health | tee /dev/stderr | grep -q '"status": "ok"'

      - name: Bridge mine + search round-trip
        run: |
          python3 scripts/mempalace_bridge.py mine --wing ci-test --room smoke --text "ci roundtrip $(date)"
          python3 scripts/mempalace_bridge.py search --query "ci roundtrip" --wing ci-test --results 3 | tee /dev/stderr | grep -q '"status": "ok"'

  vulncheck:
    name: Vulnerability scan
    runs-on: ubuntu-latest
    # Non-blocking, deliberately: govulncheck has no severity filter — it
    # reports every vulnerability whose function is reachable from our call
    # graph, and the Go vuln DB carries no CVSS/severity field to gate on,
    # so "block on HIGH only" cannot be expressed with this tool. A newly
    # published advisory in a transitive dep would otherwise red every
    # unrelated PR until the upstream fix lands. Findings stay visible in
    # the job log and the step summary; bump the dependency in a follow-up.
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.26.5'

      - name: Install govulncheck
        # Pinned: @latest silently changes the scanner between runs.
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.1.4

      - name: Run govulncheck
        run: govulncheck ./...

  release:
    name: Release (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: [test, lint, build, schema-drift]
    if: startsWith(github.ref, 'refs/tags/v')
    # The only job that writes: creates the GitHub release + uploads assets.
    permissions:
      contents: write
    strategy:
      # Sequential so the linux run creates the release and the darwin run
      # attaches to it (release.mode keep-existing in .goreleaser.yml);
      # running both at once would race on release creation.
      max-parallel: 1
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.26.5'

      - name: Install aarch64 cross toolchain (linux/arm64 cgo)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc-aarch64-linux-gnu g++-aarch64-linux-gnu

      - name: Run GoReleaser
        # cgo builds (mattn/go-sqlite3) cannot be cross-compiled to darwin
        # from Linux, so goreleaser runs once per OS; each build in
        # .goreleaser.yml is skipped unless .Runtime.Goos matches.
        uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6.4.0
        with:
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
