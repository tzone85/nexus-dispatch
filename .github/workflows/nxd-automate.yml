name: NXD Automate

on:
  issues:
    types: [labeled]

# DISABLED (2026-09-03). This workflow cannot work as written on a hosted
# runner: it pulls gemma4:26b (~16 GB) onto a 7 GB-RAM CPU-only
# ubuntu-latest box and expects a full plan → dispatch → merge pipeline to
# finish in 20 minutes, and it installed Ollama via an unpinned
# `curl … | sh`. Rather than pretend it is a working automation, the job is
# gated on `if: false` until a self-hosted GPU runner exists. To re-enable:
#   1. add a self-hosted runner label with a GPU + a pre-pulled model, set
#      `runs-on` to it and pick a model that fits (the default config uses
#      gemma4:e4b);
#   2. install Ollama from a pinned release asset with a checksum instead of
#      the install script, or pre-install it on the runner image;
#   3. drop `if: false` below.
jobs:
  nxd-automate:
    if: false  # see header comment — was: github.event.label.name == 'nxd'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
      issues: write

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.26.5'  # must match go.mod (go 1.26)

      - name: Build NXD
        run: go build -o ./nxd ./cmd/nxd/

      - name: Install Ollama
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          ollama serve &
          sleep 5

      - name: Pull model
        run: ollama pull gemma4:26b
        env:
          OLLAMA_HOST: http://localhost:11434

      - name: Initialize NXD
        run: ./nxd init

      - name: Plan requirement
        env:
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          REQUIREMENT="${ISSUE_TITLE}

          ${ISSUE_BODY}"
          ./nxd req --review "$REQUIREMENT"

      - name: Get requirement ID
        id: get-req
        run: |
          REQ_ID=$(./nxd status --json | jq -r '.requirements[0].id')
          echo "req_id=$REQ_ID" >> "$GITHUB_OUTPUT"

      - name: Approve plan
        env:
          REQ_ID: ${{ steps.get-req.outputs.req_id }}
        run: ./nxd approve "$REQ_ID"

      - name: Execute pipeline
        env:
          REQ_ID: ${{ steps.get-req.outputs.req_id }}
        run: ./nxd resume "$REQ_ID"
        timeout-minutes: 20

      - name: Create branch and PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
        run: |
          BRANCH="nxd/issue-${ISSUE_NUMBER}"
          git config user.name "NXD Bot"
          git config user.email "nxd@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add -A
          git diff --cached --quiet || git commit -m "feat: implement #${ISSUE_NUMBER}"
          git push -u origin "$BRANCH"
          gh pr create \
            --title "NXD: ${ISSUE_TITLE}" \
            --body "Automated implementation by NXD from #${ISSUE_NUMBER}" \
            --head "$BRANCH"

      - name: Comment on issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          PR_URL=$(gh pr list --head "nxd/issue-${ISSUE_NUMBER}" --json url -q '.[0].url')
          gh issue comment "$ISSUE_NUMBER" \
            --body "NXD has created a PR: $PR_URL"
